[project]
name = "gcloud-logs-anomaly-detection"
version = "0.1.0"
description = "Machine Learning tool to find anomalies in Google Cloud Logging events"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "23skdu", email = "23skdu@users.noreply.github.com"}
]
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "google-cloud-logging>=3.17.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.2",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "lorem-text>=3.0",
    "google-api-core>=2.42.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "click>=8.5.0",
    "longbow>=0.1.9",
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
]

[project.scripts]
gcloud-anomaly = "gcloud_logs_anomaly_detection.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
lint.ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_calls = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pyright]
include = ["gcloud_logs_anomaly_detection", "scripts", "tests"]
reportMissingImports = false
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
