[project]
name = "gcloud-logs-anomaly-detection"
version = "0.1.0"
description = "Machine Learning tool to find anomalies in Google Cloud Logging events"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "23skdu", email = "23skdu@users.noreply.github.com"}
]
dependencies = [
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "google-cloud-logging>=3.16.3",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.3.7",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "lorem-text>=3.0",
    "google-api-core>=2.34.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[project.scripts]
gcloud-anomaly = "gcloud_logs_anomaly_detection.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
lint.ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
